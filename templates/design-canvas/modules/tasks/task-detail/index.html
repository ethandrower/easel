<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Task detail</title>
  <script src="../../../shared/ds.js"></script>
</head>
<body>
  <main class="page">
    <a href="#" class="muted">← Back to tasks</a>
    <div class="row between" style="margin:12px 0 20px">
      <h1>Draft onboarding email</h1>
      <span class="badge amber">in progress</span>
    </div>

    <div class="row" style="align-items:flex-start; gap:20px">
      <div class="card" style="flex:2; padding:20px">
        <h2>Description</h2>
        <p class="muted">Write the welcome email sequence for new trial signups. Three touches over the first week.</p>
        <h2 style="margin-top:20px">Activity</h2>
        <p class="muted">Alex created this task · 2 days ago</p>
      </div>
      <div class="card" style="flex:1; padding:20px">
        <div class="field"><span>Assignee</span><select><option>Alex</option><option>Sam</option></select></div>
        <div class="field"><span>Due date</span><input type="date" value="2026-07-09" /></div>
        <div class="field"><span>Priority</span><select><option>High</option><option>Medium</option></select></div>
        <button class="btn" style="width:100%">Save changes</button>
      </div>
    </div>
  </main>
</body>
</html>
