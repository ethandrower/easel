<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>New task</title>
  <script src="../../../shared/ds.js"></script>
</head>
<body>
  <main class="page" style="max-width:560px">
    <h1>New task</h1>
    <p class="muted" style="margin-bottom:20px">Create a task and assign it to a teammate.</p>
    <div class="card" style="padding:24px">
      <div class="field"><span>Title</span><input placeholder="What needs to be done?" /></div>
      <div class="field"><span>Description</span><textarea rows="4"></textarea></div>
      <div class="row" style="gap:14px">
        <div class="field" style="flex:1"><span>Assignee</span><select><option>Unassigned</option><option>Alex</option></select></div>
        <div class="field" style="flex:1"><span>Due date</span><input type="date" /></div>
      </div>
      <div class="row" style="gap:8px; margin-top:6px">
        <button class="btn">Create task</button>
        <button class="btn secondary">Cancel</button>
      </div>
    </div>
  </main>
</body>
</html>
