<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Easel</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <div id="app">
    <!-- top toolbar -->
    <header id="toolbar">
      <span class="brand">▲ easel</span>
      <div id="filters" title="Filter by status">
        <button class="chip" data-status="idea">idea</button>
        <button class="chip" data-status="in-progress">in progress</button>
        <button class="chip" data-status="in-review">in review</button>
        <button class="chip" data-status="approved">approved</button>
      </div>
      <div class="tools">
        <button id="overview-toggle" title="All open comments">☰ comments <span id="overview-count"></span></button>
        <button id="arrange" title="Auto-arrange the graph by its links">⤢ arrange</button>
        <button id="fit" title="Fit to view">◹ fit</button>
        <button id="zoom-out" title="Zoom out">–</button>
        <span id="zoom-label">100%</span>
        <button id="zoom-in" title="Zoom in">+</button>
        <input id="search" type="search" placeholder="jump to view…" autocomplete="off" />
        <button id="copy-all" title="Copy a prompt to resolve every open comment">⧉ resolve all</button>
        <button id="add-view" title="Insert a new view">+ view</button>
      </div>
    </header>

    <!-- the infinite canvas -->
    <main id="canvas">
      <div id="surface">
        <div id="groups"></div>
        <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="nodes"></div>
      </div>
      <svg id="minimap" xmlns="http://www.w3.org/2000/svg"></svg>
    </main>

    <aside id="overview" hidden>
      <div class="overview-head">Open comments <button id="overview-close">×</button></div>
      <div id="overview-list"></div>
    </aside>

    <!-- the lean contextual rail -->
    <aside id="rail" class="empty">
      <div id="rail-empty">Select a view to see its links and comments.</div>
      <div id="rail-body" hidden>
        <div class="rail-head">
          <input id="v-title" class="v-title" />
          <div class="v-meta">
            <select id="v-status">
              <option value="idea">idea</option>
              <option value="in-progress">in progress</option>
              <option value="in-review">in review</option>
              <option value="approved">approved</option>
            </select>
            <span id="v-module" class="v-module"></span>
          </div>
          <div class="v-id"><code id="v-path"></code></div>
          <button id="act-focus" class="focus-btn" title="Open this view full screen (or double-click it)">⛶ Open full screen</button>
          <div class="v-actions">
            <button id="act-rename" title="Rename the folder id">rename</button>
            <button id="act-duplicate" title="Duplicate this view">duplicate</button>
            <button id="act-delete" class="danger" title="Delete this view">delete</button>
          </div>
        </div>

        <section class="rail-section">
          <h3>Related</h3>
          <div class="rail-sub">Incoming</div>
          <ul id="links-in" class="links"></ul>
          <div class="rail-sub">Outgoing</div>
          <ul id="links-out" class="links"></ul>
        </section>

        <section class="rail-section">
          <h3>Comments <span id="comment-count" class="count"></span></h3>
          <ul id="comments" class="comments"></ul>
          <button id="add-comment">+ add comment</button>
          <p id="pin-hint" hidden>Click an element in the screen to pin your comment…</p>
          <div id="composer" hidden>
            <div class="composer-sel"><code id="composer-selector"></code></div>
            <textarea id="composer-text" rows="3" placeholder="Describe the change…"></textarea>
            <div class="composer-actions">
              <button id="composer-cancel">Cancel</button>
              <button id="composer-save" class="primary">Add comment</button>
            </div>
          </div>
          <button id="copy-prompt" class="copy-prompt" title="Copy a ready-to-paste instruction for Claude Code">⧉ Copy Claude prompt</button>
        </section>
      </div>
    </aside>

    <!-- insert-view mini form -->
    <div id="insert-form" hidden>
      <h3>Insert a view</h3>
      <label>Module <input id="insert-module" placeholder="tasks" /></label>
      <label>Title <input id="insert-title" placeholder="Task Filters" /></label>
      <label>Link from (optional) <input id="insert-parent" placeholder="tasks/task-list" /></label>
      <div class="insert-actions">
        <button id="insert-cancel">Cancel</button>
        <button id="insert-create" class="primary">Create</button>
      </div>
    </div>
    <div id="edge-pop" hidden>
      <input id="edge-label" placeholder="edge label" />
      <button id="edge-save">save</button>
      <button id="edge-del" class="del">delete</button>
    </div>
    <div id="toast"></div>

    <div id="focus" hidden>
      <div class="focus-bar">
        <span id="focus-title"></span>
        <div class="focus-actions">
          <button id="focus-comment" title="Pin a comment to an element">💬 Comment</button>
          <button id="focus-copy" title="Copy a Claude prompt for this view's open comments">⧉ Copy Claude prompt</button>
          <button id="focus-close" title="Back to canvas (Esc)">× close</button>
        </div>
      </div>
      <div class="focus-body">
        <iframe id="focus-frame"></iframe>
        <div id="focus-pins"></div>
        <div id="focus-hint" hidden>Click an element in the design to pin your comment…</div>
      </div>
      <div id="focus-composer" hidden>
        <div class="composer-sel"><code id="focus-composer-sel"></code></div>
        <textarea id="focus-composer-text" rows="3" placeholder="Describe the change…"></textarea>
        <div class="composer-actions">
          <button id="focus-composer-cancel">Cancel</button>
          <button id="focus-composer-save" class="primary">Add comment</button>
        </div>
      </div>
    </div>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
